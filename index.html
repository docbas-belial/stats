<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Basketball Statistics Manager — Offline PWA for team stats tracking">
<title>Basketball Stats Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="db-init" class="db-init-screen">
  <div class="db-init-logo">🏀 BSM</div>
  <div style="font-size:20px;font-weight:700;color:var(--text-primary)">Basketball Stats Manager</div>
  <div id="init-status" style="color:var(--text-secondary);font-size:13px">Initializing database…</div>
  <div style="width:280px">
    <div class="progress-bar" style="height:4px">
      <div class="progress-fill" id="init-progress" style="width:0%"></div>
    </div>
  </div>
  <div id="init-error" style="color:var(--accent-danger);font-size:12px;max-width:400px;display:none"></div>
</div>

<div id="app" style="display:none">
  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
        BSM
      </div>
    </div>
    <div class="sidebar-nav" id="nav-menu"></div>
    <div class="sidebar-footer">
      <div class="status-row"><div class="status-dot" id="dot-db"></div><span id="status-db">Database</span></div>
      <div class="status-row"><div class="status-dot" id="dot-backup"></div><span id="status-backup">No backup yet</span></div>
      <div class="status-row"><div class="status-dot" id="dot-offline"></div><span id="status-offline">Offline</span></div>
    </div>
  </nav>
  <div id="main">
    <div id="topbar">
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<script src="js/db.js"></script>
<script src="js/stats.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/roster.js"></script>
<script src="js/views/games.js"></script>
<script src="js/views/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
