<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Basketball Statistics Manager — Offline PWA for team stats tracking">
<title>Basketball Stats Manager</title>
<style>
:root {
  --bg-base: #0a0f1e;
  --bg-surface: #111827;
  --bg-elevated: #1a2236;
  --bg-card: #1e2d45;
  --accent-primary: #3b82f6;
  --accent-secondary: #f59e0b;
  --accent-success: #10b981;
  --accent-danger: #ef4444;
  --accent-warning: #f59e0b;
  --accent-muted: #6b7280;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border: #1e3a5f;
  --border-subtle: #152135;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg-base); color: var(--text-primary); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; overflow: hidden; }
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

/* Layout */
#app { display: flex; height: 100vh; height: 100dvh; }
#sidebar { width: 220px; flex-shrink: 0; background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
#main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#topbar { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
#content { flex: 1; overflow-y: auto; padding: 24px 24px calc(48px + env(safe-area-inset-bottom, 0px)); min-height: 0; }

/* Sidebar */
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.sidebar-logo { font-size: 13px; font-weight: 700; color: var(--accent-primary); letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
.sidebar-logo svg { color: var(--accent-secondary); }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-section { padding: 8px 12px 4px; font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer; color: var(--text-secondary); font-size: 13px; font-weight: 500; border-radius: 0; transition: all 0.15s; border-left: 3px solid transparent; }
.nav-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
.nav-item.active { background: rgba(59,130,246,0.12); color: var(--accent-primary); border-left-color: var(--accent-primary); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.status-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); padding: 3px 0; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-muted); flex-shrink: 0; }
.status-dot.ok { background: var(--accent-success); }
.status-dot.warn { background: var(--accent-warning); }
.status-dot.err { background: var(--accent-danger); }

/* Topbar */
.topbar-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; border: none; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.btn-primary { background: var(--accent-primary); color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card); }
.btn-danger { background: rgba(239,68,68,0.15); color: var(--accent-danger); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-success { background: rgba(16,185,129,0.15); color: var(--accent-success); border: 1px solid rgba(16,185,129,0.3); }
.btn-success:hover { background: rgba(16,185,129,0.25); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-lg { padding: 10px 20px; font-size: 14px; }
.btn-icon { padding: 7px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Cards */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }

/* Grid layouts */
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

/* Stat tiles */
.stat-tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; }
.stat-tile-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; }
.stat-tile-value { font-size: 28px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; line-height: 1; }
.stat-tile-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.stat-tile-accent { border-left: 3px solid var(--accent-primary); }
.stat-tile-success { border-left: 3px solid var(--accent-success); }
.stat-tile-warning { border-left: 3px solid var(--accent-warning); }
.stat-tile-danger { border-left: 3px solid var(--accent-danger); }

/* Tables */
.tbl-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: var(--bg-elevated); color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border-subtle); color: var(--text-primary); }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(59,130,246,0.05); }
.td-num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--font-mono); font-size: 12px; }
.bs-tbl th, .bs-tbl td { text-align: center; padding-left: 8px; padding-right: 8px; }
.bs-tbl td.td-num { text-align: center; }
.bs-tbl th.col-name, .bs-tbl td.col-name { text-align: left; }
.bs-tbl thead tr.sub th { font-size: 10px; padding-top: 6px; padding-bottom: 6px; }
.bs-tbl thead th.grp { border-bottom: 1px solid var(--border); }
.bs-tbl thead th.sep, .bs-tbl tbody td.sep, .bs-tbl tfoot td.sep { border-left: 1px solid var(--border); }
.bs-match { cursor: pointer; transition: border-color .15s, background .15s; }
.bs-match:hover { border-color: var(--accent-primary); background: var(--bg-elevated); }
.bs-num-input { width: 46px; text-align: center; background: var(--bg-elevated); color: var(--accent-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 4px 2px; font-weight: 700; font-family: var(--font-mono); font-size: 13px; }
.bs-num-input:focus { outline: none; border-color: var(--accent-primary); }
.td-muted { color: var(--text-muted); }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
.form-input, .form-select, .form-textarea { width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; color: var(--text-primary); font-size: 13px; outline: none; transition: border-color 0.15s; font-family: inherit; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent-primary); }
.form-textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.form-error { font-size: 11px; color: var(--accent-danger); margin-top: 4px; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
.badge-green { background: rgba(16,185,129,0.15); color: #34d399; }
.badge-yellow { background: rgba(245,158,11,0.15); color: #fbbf24; }
.badge-red { background: rgba(239,68,68,0.15); color: #f87171; }
.badge-gray { background: rgba(107,114,128,0.15); color: #9ca3af; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
.modal { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 90%; max-width: 560px; max-height: 85vh; overflow-y: auto; padding: 24px; }
.modal-lg { max-width: 800px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; }
.modal-close:hover { color: var(--text-primary); background: var(--bg-elevated); }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

/* Toast */
#toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; font-size: 13px; min-width: 260px; max-width: 360px; display: flex; align-items: flex-start; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: slideIn 0.2s ease; }
.toast-success { border-left: 3px solid var(--accent-success); }
.toast-error { border-left: 3px solid var(--accent-danger); }
.toast-warning { border-left: 3px solid var(--accent-warning); }
.toast-info { border-left: 3px solid var(--accent-primary); }
@keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }

/* Live tracker specific */
.court-half { background: var(--bg-elevated); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 20px; position: relative; min-height: 200px; }
.player-btn { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-primary); transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 70px; }
.player-btn:hover { border-color: var(--accent-primary); background: rgba(59,130,246,0.1); }
.player-btn.selected { border-color: var(--accent-primary); background: rgba(59,130,246,0.2); color: var(--accent-primary); }
.player-btn .jersey { font-size: 18px; font-weight: 800; }
.player-btn .name { font-size: 10px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 68px; }
.event-btn { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text-primary); transition: all 0.15s; text-align: center; line-height: 1.3; }
.event-btn:hover { border-color: var(--accent-secondary); background: rgba(245,158,11,0.1); color: var(--accent-secondary); }
.event-btn.made { border-color: rgba(16,185,129,0.4); }
.event-btn.made:hover { border-color: var(--accent-success); background: rgba(16,185,129,0.1); color: var(--accent-success); }
.event-btn.missed { border-color: rgba(239,68,68,0.4); }
.event-btn.missed:hover { border-color: var(--accent-danger); background: rgba(239,68,68,0.1); color: var(--accent-danger); }
.score-display { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.quarter-badge { background: rgba(59,130,246,0.2); color: var(--accent-primary); padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.event-log { max-height: 280px; overflow-y: auto; }
.event-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--border-subtle); font-size: 12px; }
.event-row:last-child { border-bottom: none; }
.event-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 50px; flex-shrink: 0; }
.event-type { flex: 1; color: var(--text-primary); }
.event-player { color: var(--text-secondary); font-size: 11px; }

/* Misc */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { font-size: 18px; font-weight: 700; }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.text-success { color: var(--accent-success); }
.text-danger { color: var(--accent-danger); }
.text-warning { color: var(--accent-warning); }
.text-muted { color: var(--text-muted); }
.text-secondary { color: var(--text-secondary); }
.loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); gap: 10px; }
.spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress-bar { background: var(--bg-elevated); border-radius: 4px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; background: var(--accent-primary); transition: width 0.3s; }
.db-init-screen { position: fixed; inset: 0; background: var(--bg-base); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; gap: 16px; text-align: center; padding: 32px; }
.db-init-logo { font-size: 36px; font-weight: 800; color: var(--accent-primary); margin-bottom: 8px; }
.compact-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.compact-stat { background: var(--bg-elevated); padding: 8px; text-align: center; }
.compact-stat-val { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.compact-stat-key { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.tab-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
.tab.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
.tab:hover { color: var(--text-primary); }
.input-search { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; color: var(--text-primary); font-size: 13px; outline: none; width: 220px; }
.input-search:focus { border-color: var(--accent-primary); }
.player-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-elevated); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--accent-primary); flex-shrink: 0; }
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="db-init" class="db-init-screen">

  <div style="font-size:20px;font-weight:700;color:var(--text-primary)">Basketball Stats Manager</div>

<div id="app" style="display:none">
  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>

<script>
// ============================================================
// DATABASE ENGINE — SQLite via IndexedDB (OPFS-ready fallback)
// ============================================================
// Since OPFS requires cross-origin isolation headers (COOP/COEP) 
// which aren't available in the artifact iframe, we use IndexedDB
// as a persistent storage backend with SQLite-like transaction semantics.
// In a real deployment (localhost/HTTPS with COOP/COEP headers),
// replace this with @sqlite.org/sqlite-wasm + OPFS adapter.
// ============================================================

const SCHEMA_VERSION = 3;
const LS_KEY = 'bsm_data_v3';

const state = {
  currentPage: 'dashboard',
  liveMatch: null,
  selectedPlayer: null,
  selectedMatchId: null,
  bsView: 'list',          // Box Score: 'list' (daftar pertandingan) | 'detail'
  bsCompetition: null,     // Box Score: filter kompetisi
  lastBackup: null,
  dbReady: false,
  dbError: null,
};

// ============================================================
// IN-MEMORY + localStorage STORAGE ENGINE
// Works in all environments including sandboxed iframes.
// All data lives in _mem{} and is flushed to localStorage on
// every write. On boot, data is rehydrated from localStorage.
// ============================================================
const STORE_NAMES = ['players','seasons','competitions','matches','match_rosters','game_events','period_scores','player_match_stats','team_match_stats','backup_history','audit_log','settings'];
const STORES = Object.fromEntries(STORE_NAMES.map(s => [s, true]));

// Masukkan URL dan API KEY Supabase Anda di bawah ini
const SUPABASE_URL = 'https://qnqzsghvzoxhfxenmtzg.supabase.co/rest/v1/';
const SUPABASE_KEY = 'sb_publishable_ZtFmxhWJ0yiOXeUgARr8rw_8cDnkQQn;
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const KEY_OF = { settings: 'key' };

// Mematikan engine localStorage bawaan agar tidak error
function scheduleSave() {}
function _loadFromStorage() { return true; }
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
const now = () => new Date().toISOString();
// --- Konektor Supabase ---
function txGet(storeName, id) {
  const key = KEY_OF[storeName] || 'id';
  return supabase.from(storeName).select('*').eq(key, id).single().then(({ data }) => data || null);
}
function txPut(storeName, obj) {
  return supabase.from(storeName).upsert(obj).then(() => obj);
}
function txDelete(storeName, id) {
  const key = KEY_OF[storeName] || 'id';
  return supabase.from(storeName).delete().eq(key, id).then(() => {});
}
function txGetAll(storeName, indexField, value) {
  let query = supabase.from(storeName).select('*').limit(10000);
  if (indexField !== undefined && value !== undefined) query = query.eq(indexField, value);
  return query.then(({ data }) => data || []);
}
function txMultiPut(storeName, objs) {
  if (!objs || !objs.length) return Promise.resolve();
  return supabase.from(storeName).upsert(objs).then(() => {});
}
function txClear(storeName) {
  const key = KEY_OF[storeName] || 'id';
  return supabase.from(storeName).delete().neq(key, 'delete-all').then(() => {});
}

// --- Settings shortcuts ---
async function getSetting(key, def = null) {
  const r = await txGet('settings', key);
  return r ? r.value : def;
}
async function setSetting(key, value) {
  await txPut('settings', { key, value, updated_at: now() });
}

// --- Audit log ---
async function audit(entity_type, entity_id, action, data = {}) {
  await txPut('audit_log', { id: uuid(), entity_type, entity_id, action, data, created_at: now() });
}

// ============================================================
// STATISTICS ENGINE
// ============================================================
function calcBoxScore(events, playerId) {
  const evs = events.filter(e => e.player_id === playerId && !e.voided);
  let pts=0,fgm=0,fga=0,pm2=0,pa2=0,pm3=0,pa3=0,ftm=0,fta=0,orb=0,drb=0,ast=0,stl=0,blk=0,tov=0,pf=0;
  for (const e of evs) {
    switch(e.type) {
      case '2PM': pts+=2; fgm++; fga++; pm2++; pa2++; break;
      case '2PA': fga++; pa2++; break;
      case '3PM': pts+=3; fgm++; fga++; pm3++; pa3++; break;
      case '3PA': fga++; pa3++; break;
      case 'FTM': pts++; ftm++; fta++; break;
      case 'FTA': fta++; break;
      case 'ORB': orb++; break;
      case 'DRB': drb++; break;
      case 'AST': ast++; break;
      case 'STL': stl++; break;
      case 'BLK': blk++; break;
      case 'TOV': tov++; break;
      case 'PF': pf++; break;
    }
  }
  const trb = orb + drb;
  const fgPct = fga > 0 ? (fgm/fga*100).toFixed(1) : 'N/A';
  const p2Pct = pa2 > 0 ? (pm2/pa2*100).toFixed(1) : 'N/A';
  const p3Pct = pa3 > 0 ? (pm3/pa3*100).toFixed(1) : 'N/A';
  const ftPct = fta > 0 ? (ftm/fta*100).toFixed(1) : 'N/A';
  return { pts, fgm, fga, fgPct, pm2, pa2, p2Pct, pm3, pa3, p3Pct, ftm, fta, ftPct, orb, drb, trb, ast, stl, blk, tov, pf };
}
function calcTeamBoxScore(events, teamSide='home') {
  const evs = events.filter(e => e.team === teamSide && !e.voided);
  let pts=0,fgm=0,fga=0,pm2=0,pa2=0,pm3=0,pa3=0,ftm=0,fta=0,orb=0,drb=0,ast=0,stl=0,blk=0,tov=0,pf=0;
  for (const e of evs) {
    switch(e.type) {
      case '2PM': pts+=2; fgm++; fga++; pm2++; pa2++; break;
      case '2PA': fga++; pa2++; break;
      case '3PM': pts+=3; fgm++; fga++; pm3++; pa3++; break;
      case '3PA': fga++; pa3++; break;
      case 'FTM': pts++; ftm++; fta++; break;
      case 'FTA': fta++; break;
      case 'ORB': orb++; break;
      case 'DRB': drb++; break;
      case 'AST': ast++; break;
      case 'STL': stl++; break;
      case 'BLK': blk++; break;
      case 'TOV': tov++; break;
      case 'PF': pf++; break;
    }
  }
  const trb = orb + drb;
  return { pts, fgm, fga, pm2, pa2, pm3, pa3, ftm, fta, orb, drb, trb, ast, stl, blk, tov, pf };
}
function calcAdvanced(teamStats, oppStats, minutes = 40) {
  const { pts: tp, fgm, fga, pm3, pa3, ftm, fta, orb, drb: tdrb, ast, tov, pf } = teamStats;
  const { pts: op, drb: odrb, orb: oorb, tov: otov, fga: ofga, fta: ofta, ftm: oftm } = oppStats;
  const odrb2 = odrb || 1;
  const orbPct = orb + odrb2 > 0 ? (orb / (orb + odrb2) * 100).toFixed(1) : 'N/A';
  const tsPct = (2*fga + 0.44*fta) > 0 ? (tp / (2*(2*fga + 0.44*fta)) * 100).toFixed(1) : 'N/A';
  const efgPct = fga > 0 ? ((fgm + 0.5*pm3) / fga * 100).toFixed(1) : 'N/A';
  const astTov = tov > 0 ? (ast / tov).toFixed(2) : 'N/A';
  const ftRate = fga > 0 ? (fta / fga).toFixed(3) : 'N/A';
  const tovPct = (fga + 0.44*fta + tov) > 0 ? (tov / (fga + 0.44*fta + tov) * 100).toFixed(1) : 'N/A';
  // Estimate possessions
  const posHome = fga - orb + tov + 0.44*fta;
  const posOpp = ofga - oorb + otov + 0.44*ofta;
  const pace = minutes > 0 ? ((posHome + posOpp) / 2 / minutes * 40).toFixed(1) : 'N/A';
  const offRtg = posHome > 0 ? (tp / posHome * 100).toFixed(1) : 'N/A';
  const defRtg = posOpp > 0 ? (op / posOpp * 100).toFixed(1) : 'N/A';
  const netRtg = (offRtg !== 'N/A' && defRtg !== 'N/A') ? (parseFloat(offRtg) - parseFloat(defRtg)).toFixed(1) : 'N/A';
  return { orbPct, tsPct, efgPct, astTov, ftRate, tovPct, pace, offRtg, defRtg, netRtg };
}

function fmtPct(v) { return v === 'N/A' ? 'N/A' : v + '%'; }
function fmtStat(v) { return v == null ? '—' : v; }

function buildNav() {
  const nav = document.getElementById('nav-menu');
  let lastSection = '';
  nav.innerHTML = PAGES.map(p => {
    let sectionHtml = '';
    if (p.section !== lastSection) {
      sectionHtml = `<div class="nav-section">${p.section}</div>`;
      lastSection = p.section;
    }
    return `${sectionHtml}<div class="nav-item" onclick="navigateFromMenu('${p.id}')" data-page="${p.id}">
      <span>${p.icon}</span><span>${p.label}</span></div>`;
  }).join('');
}

async function navigateFromMenu(pageId) {
  if (pageId === 'boxscore') state.bsView = 'list';
  await navigate(pageId);
}
async function navigate(pageId) {
  state.currentPage = pageId;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`[data-page="${pageId}"]`);
  if (el) el.classList.add('active');
  const page = PAGES.find(p => p.id === pageId);
  document.getElementById('page-title').textContent = page?.label || pageId;
  document.getElementById('topbar-actions').innerHTML = '';
  await renderPage(pageId);
}

async function renderPage(pageId) {
  const content = document.getElementById('content');
  switch (pageId) {
    case 'dashboard': await renderDashboard(); break;
    case 'players': await renderPlayers(); break;
    case 'seasons': await renderSeasons(); break;
    case 'matches': await renderMatches(); break;
    case 'live': await renderLive(); break;
    case 'boxscore': await renderBoxScore(); break;
    case 'analytics': await renderAnalytics(); break;
    case 'player-analytics': await renderPlayerAnalytics(); break;
    case 'history': await renderHistory(); break;
    case 'reports': await renderReports(); break;
    case 'backup': await renderBackup(); break;
    case 'settings': await renderSettings(); break;
    default: content.innerHTML = '<div class="empty-state"><div class="empty-state-title">Page not found</div></div>';
  }
}

    txGetAll('matches'), txGetAll('players'),
  ]);
  const completed = matches.filter(m => m.status === 'completed' || m.status === 'archived');
  const wins = completed.filter(m => m.home_score > m.away_score);
  const losses = completed.filter(m => m.home_score <= m.away_score && m.home_score !== null && m.away_score !== null);
  const avgPts = completed.length ? (completed.reduce((a,m)=>a+(m.home_score||0),0)/completed.length).toFixed(1) : 'N/A';
  const avgOpp = completed.length ? (completed.reduce((a,m)=>a+(m.away_score||0),0)/completed.length).toFixed(1) : 'N/A';
  const avgDiff = (avgPts !== 'N/A' && avgOpp !== 'N/A') ? (parseFloat(avgPts)-parseFloat(avgOpp)).toFixed(1) : 'N/A';
  const winRate = completed.length ? (wins.length/completed.length*100).toFixed(0)+'%' : 'N/A';

      <div class="stat-tile-value">${avgPts}</div>

    </div>
    <div class="stat-tile" style="border-left:3px solid #8b5cf6">
      <div class="stat-tile-label">Off Rating</div>

      <div class="stat-tile-sub">Points per 100 possessions</div>
    </div>
    <div class="stat-tile" style="border-left:3px solid #ec4899">
      <div class="stat-tile-label">Net Rating</div>
      <div class="stat-tile-value" style="color:${netRtg!=='N/A' && parseFloat(netRtg)>=0 ? '#34d399':'#f87171'}">${netRtg}</div>
      <div class="stat-tile-sub">Off ${offRtg} · Def ${defRtg}</div>
    </div>
  </div>
  
  <div class="grid-2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-header"><span class="card-title">Last 5 Matches</span></div>
      ${last5.length === 0 ? '<div class="text-muted" style="font-size:13px;text-align:center;padding:20px">No completed matches yet</div>' :
        `<div>${last5.map(m=>{
          const win = m.home_score > m.away_score;
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-subtle)">
            <div>
              <div style="font-size:13px;font-weight:600">${m.opponent}</div>
              <div style="font-size:11px;color:var(--text-muted)">${m.date ? m.date.split('T')[0] : ''} · ${m.competition||'—'}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              <div style="font-size:15px;font-weight:700;font-variant-numeric:tabular-nums">${m.home_score??'—'}–${m.away_score??'—'}</div>
              <span class="badge ${win?'badge-green':'badge-red'}">${win?'W':'L'}</span>

async function renderPlayers() {
  const content = document.getElementById('content');
  const actionsEl = document.getElementById('topbar-actions');
  actionsEl.innerHTML = `<button class="btn btn-primary" onclick="showPlayerModal()">+ Add Player</button>`;

  const [players, seasons] = await Promise.all([txGetAll('players'), txGetAll('seasons')]);
  seasons.sort((a,b) => b.start_year - a.start_year);

  const active = players.filter(p => p.status === 'active');
  const inactive = players.filter(p => p.status !== 'active');

  content.innerHTML = `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <input class="input-search" id="player-search" placeholder="Search players…" oninput="filterPlayers()">
    <select class="form-select" id="player-filter" onchange="filterPlayers()" style="width:130px">
      <option value="all">All Players</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
    <select class="form-select" id="player-season-filter" onchange="filterPlayers()" style="width:160px">
      <option value="">All Seasons</option>
      ${seasons.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
    </select>
  </div>
  <div id="players-grid">
    ${renderPlayersGrid(active, inactive)}
  </div>`;
}

function renderPlayersGrid(active, inactive) {
  const all = [...active, ...inactive];
  if (!all.length) return `<div class="empty-state">
    <div class="empty-state-icon">👤</div>
    <div class="empty-state-title">No players yet</div>
    <div>Add your first player to get started.</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="showPlayerModal()">Add Player</button>
  </div>`;

  const makeTable = (list, colspan=7) => list.length
    ? list.map(p => playerRow(p)).join('')
    : `<tr><td colspan="${colspan}" style="text-align:center;color:var(--text-muted);padding:20px">No players</td></tr>`;

  return `<div style="margin-bottom:20px">
    <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Active (${active.length})</div>
    <div class="tbl-wrap">
      <table><thead><tr>
        <th>#</th><th>Player</th><th>Position</th><th>Height</th><th>Hand</th><th>Status</th><th>Actions</th>
      </tr></thead><tbody>${makeTable(active)}</tbody></table>
    </div>
  </div>
  ${inactive.length ? `<div>
    <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Inactive / Archived (${inactive.length})</div>
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Player</th><th>Position</th><th>Height</th><th>Hand</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${makeTable(inactive)}</tbody></table>
    </div>
  </div>` : ''}`;
}

function playerRow(p) {
  const initials = (p.name||'?').split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
  return `<tr>
    <td><span style="font-weight:700;font-size:15px;color:var(--accent-secondary)">${p.number||'—'}</span></td>
    <td><div style="display:flex;align-items:center;gap:8px">
      <div class="player-avatar">${initials}</div>
      <div><div style="font-weight:600">${p.name}</div><div class="td-muted" style="font-size:11px">${p.notes||''}</div></div>
    </div></td>
    <td>${p.position||'—'}</td>
    <td>${p.height||'—'}</td>
    <td>${p.dominant_hand||'—'}</td>
    <td>
      <span class="badge ${p.status==='active'?'badge-green':'badge-gray'}"
        style="cursor:pointer;user-select:none" title="Klik untuk ubah status"
        onclick="showStatusPopup(event,'${p.id}','${p.status}')">
        ${p.status} ▾
      </span>
    </td>
    <td>
      <div style="display:flex;gap:4px">
        <button class="btn btn-secondary btn-sm" onclick="showPlayerModal('${p.id}')">Edit</button>
        <button class="btn btn-secondary btn-sm" onclick="showPlayerStats('${p.id}')">Stats</button>
        <button class="btn btn-danger btn-sm" onclick="deletePlayer('${p.id}')">Delete</button>
      </div>
    </td>
  </tr>`;
}

// ---- Status popup (click on badge) ----
function showStatusPopup(event, playerId, currentStatus) {
  event.stopPropagation();
  // Remove existing popup
  document.getElementById('status-popup')?.remove();

  const popup = document.createElement('div');
  popup.id = 'status-popup';
  popup.style.cssText = `position:fixed;z-index:3000;background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:8px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:140px`;

  const rect = event.target.getBoundingClientRect();
  popup.style.top  = (rect.bottom + 6) + 'px';
  popup.style.left = rect.left + 'px';

  popup.innerHTML = `
    <div style="font-size:10px;font-weight:700;color:var(--text-muted);padding:4px 8px 6px;text-transform:uppercase;letter-spacing:.06em">Ubah Status</div>
    <button onclick="setPlayerStatus('${playerId}','active')"
      style="display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;background:none;border:none;
             cursor:pointer;color:var(--text-primary);border-radius:5px;font-size:13px"
      onmouseover="this.style.background='rgba(16,185,129,.15)'" onmouseout="this.style.background='none'">
      <span style="width:8px;height:8px;border-radius:50%;background:#10b981;flex-shrink:0"></span> Active
      ${currentStatus==='active'?'<span style="margin-left:auto;font-size:11px;color:var(--accent-success)">✓</span>':''}
    </button>
    <button onclick="setPlayerStatus('${playerId}','inactive')"
      style="display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;background:none;border:none;
             cursor:pointer;color:var(--text-primary);border-radius:5px;font-size:13px"
      onmouseover="this.style.background='rgba(107,114,128,.15)'" onmouseout="this.style.background='none'">
      <span style="width:8px;height:8px;border-radius:50%;background:#6b7280;flex-shrink:0"></span> Inactive
      ${currentStatus==='inactive'?'<span style="margin-left:auto;font-size:11px;color:var(--text-muted)">✓</span>':''}
    </button>`;

  document.body.appendChild(popup);

  // Close on outside click
  const close = (e) => { if (!popup.contains(e.target)) { popup.remove(); document.removeEventListener('click', close); } };
  setTimeout(() => document.addEventListener('click', close), 10);
}

async function setPlayerStatus(id, newStatus) {
  document.getElementById('status-popup')?.remove();
  const player = await txGet('players', id);
  if (!player || player.status === newStatus) return;
  player.status = newStatus;
  player.updated_at = now();
  await txPut('players', player);
  await audit('player', id, newStatus, {});
  toast(`${player.name} → ${newStatus}`, 'success');
  await filterPlayers();
}

async function filterPlayers() {
  const search   = (document.getElementById('player-search')?.value || '').toLowerCase();
  const filter   = document.getElementById('player-filter')?.value || 'all';
  const seasonId = document.getElementById('player-season-filter')?.value || '';

  let players = await txGetAll('players');
  players.sort((a,b) => (a.number||999) - (b.number||999));

  // Filter by season: only show players who appeared in at least one match of that season
  if (seasonId) {
    const matches  = await txGetAll('matches', 'season_id', seasonId);
    const matchIds = matches.map(m => m.id);
    const rosters  = await txGetAll('match_rosters');
    const pidsInSeason = new Set(rosters.filter(r => matchIds.includes(r.match_id)).map(r => r.player_id));
    // Also include players with events in those matches (covers live-tracked games)
    const events = await txGetAll('game_events');
    events.filter(e => matchIds.includes(e.match_id) && e.player_id).forEach(e => pidsInSeason.add(e.player_id));
    players = players.filter(p => pidsInSeason.has(p.id));
  }

  if (search)          players = players.filter(p => (p.name||'').toLowerCase().includes(search) || (p.number+'').includes(search));
  if (filter==='active')   players = players.filter(p => p.status === 'active');
  if (filter==='inactive') players = players.filter(p => p.status !== 'active');

  document.getElementById('players-grid').innerHTML = renderPlayersGrid(
    players.filter(p => p.status === 'active'),
    players.filter(p => p.status !== 'active')
  );
}

          ${positions.map(pos=>`<option value="${pos}" ${player?.position===pos?'selected':''}>${pos}</option>`).join('')}

      <div class="form-group"><label class="form-label">Dominant Hand</label>

  `, async () => {

      position: document.getElementById('p-pos').value || null,
      height:   document.getElementById('p-height').value || null,
      dob:      document.getElementById('p-dob').value || null,
      dominant_hand: document.getElementById('p-hand').value || null,

    await txPut('players', obj);
    await audit('player', obj.id, id ? 'update' : 'create', { name });
    toast(`Player ${id ? 'updated' : 'added'}: ${name}`, 'success');
    closeModal();
    await renderPlayers();
  });
}

// ---- Delete player ----
async function deletePlayer(id) {
  const player = await txGet('players', id);
  if (!player) { toast('Player tidak ditemukan', 'error'); return; }
  const [rosters, events, pms] = await Promise.all([
    txGetAll('match_rosters', 'player_id', id),
    txGetAll('game_events', 'player_id', id),
    txGetAll('player_match_stats', 'player_id', id),
  ]);
  const hasHistory = rosters.length || events.length || pms.length;
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const body = `
    <p style="font-size:13px;line-height:1.6">Hapus <strong>${esc(player.name)}</strong>${player.number!=null ? ' (#'+esc(player.number)+')' : ''} secara permanen?</p>
    ${hasHistory ? `<div style="margin-top:10px;padding:10px;background:var(--bg-elevated);border-radius:var(--radius-sm);font-size:12px;line-height:1.6">
      <span style="color:var(--accent-warning);font-weight:600">⚠ Pemain ini punya riwayat:</span><br>
      ${rosters.length} roster pertandingan, ${events.filter(e=>!e.voided).length} event, ${pms.length} statistik manual.<br>
      Semua data tersebut ikut terhapus dan statistik tim di pertandingan terkait bisa berubah.
      Kalau hanya tidak aktif lagi, lebih aman ubah status jadi <strong>inactive</strong>.</div>` : ''}
    <p style="font-size:12px;color:var(--text-muted);margin-top:10px">Tindakan ini tidak bisa dibatalkan. Buat backup dulu kalau ragu.</p>`;
  showModal('Delete Player', body, async () => {
    closeModal();
    try {
      for (const r of rosters) await txDelete('match_rosters', r.id);
      for (const e of events)  await txDelete('game_events', e.id);
      for (const s of pms)     await txDelete('player_match_stats', s.id);
      await txDelete('players', id);
      await audit('player', id, 'delete', { name: player.name });
      toast(`Player dihapus: ${player.name}`, 'success');
    } catch (err) {
      toast('Gagal menghapus: ' + err.message, 'error');
      console.error(err);
    }
    await renderPlayers();
  }, 'Delete');
}

// ---- Career Stats (averages + Efficiency) ----
async function showPlayerStats(id) {
  const [player, allEvents, allMatches, allRosters, seasons] = await Promise.all([
    txGet('players', id),
    txGetAll('game_events'),
    txGetAll('matches'),
    txGetAll('match_rosters'),
    txGetAll('seasons'),
  ]);
  if (!player) return;

  seasons.sort((a,b) => b.start_year - a.start_year);
  const seasonMap = Object.fromEntries(seasons.map(s => [s.id, s.name]));

  // helper: compute stats for a set of events and game count
  function computeAvg(events, gamesPlayed) {
    const s = calcBoxScore(events, id);
    const gp = gamesPlayed || 1;
    const avg = (v) => gp > 0 ? (v / gp).toFixed(1) : '0.0';
    // Efficiency = PTS + REB + AST + STL + BLK - TOV - (FGA-FGM) - (FTA-FTM)
    const eff = s.pts + s.trb + s.ast + s.stl + s.blk - s.tov - (s.fga - s.fgm) - (s.fta - s.ftm);
    return { s, gp, avg, eff };
  }

  // Build season selector options
  const seasonOpts = seasons.map(s =>
    `<option value="${s.id}">${s.name}</option>`
  ).join('');

  // Get matches this player appeared in (via roster or events)
  function getPlayerMatchIds(matchIds) {
    const rosterMatchIds = allRosters.filter(r => r.player_id === id).map(r => r.match_id);
    const eventMatchIds  = allEvents.filter(e => e.player_id === id && !e.voided).map(e => e.match_id);
    const all = new Set([...rosterMatchIds, ...eventMatchIds]);
    return matchIds ? matchIds.filter(mid => all.has(mid)) : [...all];
  }

  function renderStatsForScope(seasonFilter) {
    let matchPool;
    if (seasonFilter === 'career') {
      matchPool = allMatches.filter(m => m.status === 'completed' || m.status === 'archived');
    } else {
      matchPool = allMatches.filter(m => m.season_id === seasonFilter && (m.status === 'completed' || m.status === 'archived'));
    }
    const matchIds     = matchPool.map(m => m.id);
    const playerMatchIds = getPlayerMatchIds(matchIds);
    const gp           = playerMatchIds.length;
    const scopeEvents  = allEvents.filter(e => e.player_id === id && !e.voided && playerMatchIds.includes(e.match_id));
    const { s, avg, eff } = computeAvg(scopeEvents, gp);

    return `
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px">
        ${[['PTS',avg(s.pts)],['REB',avg(s.trb)],['AST',avg(s.ast)],['STL',avg(s.stl)],['BLK',avg(s.blk)]].map(([k,v])=>`
          <div style="background:var(--bg-elevated);padding:10px;text-align:center">
            <div style="font-size:20px;font-weight:800;color:var(--accent-primary)">${v}</div>
            <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">${k}</div>
          </div>`).join('')}
      </div>

      <div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">Efficiency (EFF)</div>
          <div style="font-size:10px;color:var(--text-muted)">PTS+REB+AST+STL+BLK−TOV−(FGA−FGM)−(FTA−FTM)</div>
        </div>
        <div style="font-size:32px;font-weight:800;color:${eff>=0?'var(--accent-success)':'var(--accent-danger)'}">${gp>0?(eff/gp).toFixed(1):'—'}</div>
      </div>

      <div class="tbl-wrap"><table>
        <thead><tr><th>Statistik</th><th style="text-align:right">Per Game</th><th style="text-align:right">Total</th><th style="text-align:right">%</th></tr></thead>
        <tbody>
          <tr><td style="color:var(--text-muted);font-size:11px;padding:6px 12px" colspan="4">SHOOTING</td></tr>
          <tr><td>Field Goals</td><td class="td-num">${avg(s.fgm)}/${avg(s.fga)}</td><td class="td-num">${s.fgm}/${s.fga}</td><td class="td-num">${fmtPct(s.fgPct)}</td></tr>
          <tr><td>2-Point</td><td class="td-num">${avg(s.pm2)}/${avg(s.pa2)}</td><td class="td-num">${s.pm2}/${s.pa2}</td><td class="td-num">${fmtPct(s.p2Pct)}</td></tr>
          <tr><td>3-Point</td><td class="td-num">${avg(s.pm3)}/${avg(s.pa3)}</td><td class="td-num">${s.pm3}/${s.pa3}</td><td class="td-num">${fmtPct(s.p3Pct)}</td></tr>
          <tr><td>Free Throw</td><td class="td-num">${avg(s.ftm)}/${avg(s.fta)}</td><td class="td-num">${s.ftm}/${s.fta}</td><td class="td-num">${fmtPct(s.ftPct)}</td></tr>
          <tr><td style="color:var(--text-muted);font-size:11px;padding:6px 12px" colspan="4">REBOUNDING & DEFENSE</td></tr>
          <tr><td>Off Rebound</td><td class="td-num">${avg(s.orb)}</td><td class="td-num">${s.orb}</td><td class="td-num">—</td></tr>
          <tr><td>Def Rebound</td><td class="td-num">${avg(s.drb)}</td><td class="td-num">${s.drb}</td><td class="td-num">—</td></tr>
          <tr><td>Total Rebound</td><td class="td-num">${avg(s.trb)}</td><td class="td-num">${s.trb}</td><td class="td-num">—</td></tr>
          <tr><td>Steals</td><td class="td-num">${avg(s.stl)}</td><td class="td-num">${s.stl}</td><td class="td-num">—</td></tr>
          <tr><td>Blocks</td><td class="td-num">${avg(s.blk)}</td><td class="td-num">${s.blk}</td><td class="td-num">—</td></tr>
          <tr><td style="color:var(--text-muted);font-size:11px;padding:6px 12px" colspan="4">PLAYMAKING</td></tr>
          <tr><td>Assists</td><td class="td-num">${avg(s.ast)}</td><td class="td-num">${s.ast}</td><td class="td-num">—</td></tr>
          <tr><td>Turnovers</td><td class="td-num" style="color:var(--accent-danger)">${avg(s.tov)}</td><td class="td-num">${s.tov}</td><td class="td-num">—</td></tr>
          <tr><td>Personal Fouls</td><td class="td-num" style="color:var(--accent-warning)">${avg(s.pf)}</td><td class="td-num">${s.pf}</td><td class="td-num">—</td></tr>
        </tbody>
      </table></div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:8px">GP: ${gp} pertandingan · Avg = total ÷ GP</div>`;
  }

  const initSeason = seasons[0]?.id || 'career';
  const initContent = renderStatsForScope(initSeason || 'career');

  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <div>
          <div class="modal-title">${player.name} — Stats</div>
          <div style="font-size:11px;color:var(--text-muted)">${player.position||''}${player.number?' · #'+player.number:''}</div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <span style="font-size:12px;color:var(--text-muted);font-weight:600">Season:</span>
        <select class="form-select" id="stats-season-sel" onchange="refreshPlayerStatsView()" style="width:180px;font-size:13px">
          <option value="career">— Career (All) —</option>
          ${seasonOpts}
        </select>
      </div>
      <div id="stats-modal-body">${initContent}</div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Tutup</button></div>
    </div>
  </div>`;

  // Store context for refresh
  window._statsCtx = { id, allEvents, allMatches, allRosters, seasons, seasonMap, renderStatsForScope };
}

function refreshPlayerStatsView() {
  const sel = document.getElementById('stats-season-sel')?.value || 'career';
  const ctx = window._statsCtx;
  if (!ctx) return;
  document.getElementById('stats-modal-body').innerHTML = ctx.renderStatsForScope(sel);
}

async function renderSeasons() {
  const content = document.getElementById('content');
  document.getElementById('topbar-actions').innerHTML = `<button class="btn btn-primary" onclick="showSeasonModal()">+ Add Season</button>`;
  const seasons = await txGetAll('seasons');
  seasons.sort((a,b) => b.start_year - a.start_year);

  // Count matches per season
  const allMatches = await txGetAll('matches');
  const matchCount = {};
  for (const m of allMatches) {
    if (m.season_id) matchCount[m.season_id] = (matchCount[m.season_id] || 0) + 1;
  }

  content.innerHTML = `
  <div class="grid-auto">
    ${seasons.length ? seasons.map(s => {
      const mc = matchCount[s.id] || 0;
      const wins = allMatches.filter(m => m.season_id === s.id && m.home_score != null && m.home_score > m.away_score).length;
      const losses = allMatches.filter(m => m.season_id === s.id && m.home_score != null && m.home_score < m.away_score).length;
      return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div style="font-size:16px;font-weight:700">${s.name}</div>
          <span class="badge ${s.is_current?'badge-green':'badge-gray'}">${s.is_current?'Current':s.status||'Past'}</span>
        </div>
        <div class="text-muted" style="font-size:12px;margin-bottom:4px">${s.start_year||'?'}–${s.end_year||'?'}</div>
        ${s.description ? `<div class="text-muted" style="font-size:12px;margin-bottom:4px">${s.description}</div>` : ''}
        <div style="display:flex;gap:12px;font-size:12px;margin-bottom:12px">
          <span style="color:var(--text-secondary)">${mc} match${mc!==1?'es':''}</span>
          ${mc > 0 ? `<span class="text-success">${wins}W</span><span class="text-danger">${losses}L</span>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="showSeasonModal('${s.id}')">Edit</button>
          ${!s.is_current ? `<button class="btn btn-success btn-sm" onclick="setCurrentSeason('${s.id}')">Set Current</button>` : ''}
          <button class="btn btn-danger btn-sm" onclick="deleteSeason('${s.id}','${s.name.replace(/'/g,"\\'")}',${mc})">🗑 Hapus</button>
        </div>
      </div>`;
    }).join('') : `<div class="empty-state">
      <div class="empty-state-icon">📅</div>
      <div class="empty-state-title">No seasons yet</div>
      <div>Create your first season to organize matches.</div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="showSeasonModal()">Add Season</button>
    </div>`}
  </div>`;
}

async function showSeasonModal(id = null) {
  let s = id ? await txGet('seasons', id) : null;
  showModal(`${id ? 'Edit' : 'Add'} Season`, `
    <div class="form-group"><label class="form-label">Season Name *</label>
      <input class="form-input" id="s-name" value="${s?.name||''}" placeholder="e.g. 2024/2025"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Start Year</label>
        <input class="form-input" id="s-start" type="number" value="${s?.start_year||new Date().getFullYear()}"></div>
      <div class="form-group"><label class="form-label">End Year</label>
        <input class="form-input" id="s-end" type="number" value="${s?.end_year||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Description</label>
      <input class="form-input" id="s-desc" value="${s?.description||''}" placeholder="Optional"></div>
    <div class="form-group" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="s-current" ${s?.is_current?'checked':''}>
      <label class="form-label" for="s-current" style="margin:0">Mark as current season</label>
    </div>
  `, async () => {
    const name = document.getElementById('s-name').value.trim();
    if (!name) { toast('Season name required', 'error'); return false; }
    const isCurrent = document.getElementById('s-current').checked;
    if (isCurrent) {
      const all = await txGetAll('seasons');
      for (const s2 of all) { if (s2.id !== id) { s2.is_current = false; await txPut('seasons', s2); } }
    }
    await txPut('seasons', {
      id: id || uuid(), name,
      start_year: parseInt(document.getElementById('s-start').value) || null,
      end_year:   parseInt(document.getElementById('s-end').value)   || null,
      description: document.getElementById('s-desc').value,
      is_current: isCurrent,
      created_at: s?.created_at || now(),
      updated_at: now(),
    });
    toast(`Season ${id ? 'updated' : 'created'}`, 'success');
    closeModal();
    await renderSeasons();
  });
}

async function setCurrentSeason(id) {
  const all = await txGetAll('seasons');
  for (const s of all) { s.is_current = (s.id === id); await txPut('seasons', s); }
  toast('Current season updated', 'success');
  await renderSeasons();
}

async function deleteSeason(id, name, matchCount) {
  const hasMatches = matchCount > 0;
  const confirmMsg = hasMatches
    ? `Hapus season "${name}"?\n\n⚠ Season ini memiliki ${matchCount} match. Match-match tersebut TIDAK akan dihapus — hanya kaitannya dengan season ini yang akan dihilangkan (season_id → null).\n\nLanjut?`
    : `Hapus season "${name}"? Tindakan ini tidak dapat dibatalkan.`;

  if (!confirm(confirmMsg)) return;

  // Unlink matches from this season (don't delete the match data)
  if (hasMatches) {
    const matches = await txGetAll('matches', 'season_id', id);
    for (const m of matches) {
      m.season_id = null;
      m.updated_at = now();
      await txPut('matches', m);
    }
  }

  await txDelete('seasons', id);
  await audit('season', id, 'delete', { name, match_count: matchCount });
  toast(`Season "${name}" dihapus${hasMatches ? ` (${matchCount} match di-unlink)` : ''}`, 'success');
  await renderSeasons();
}

function updateMatchCountLabel(n) {

function renderMatchesTable(matches, seasonMap) {
  if (!matches.length) return `<div class="empty-state"><div class="empty-state-icon">🗒️</div><div class="empty-state-title">No matches found</div><div>Coba ubah filter atau tambah pertandingan baru.</div></div>`;

  const catBadge = { regular:'badge-blue', friendly:'badge-gray', playoff:'badge-yellow', tournament:'badge-yellow' };

  return `<table><thead><tr>
    <th>Date</th><th>Opponent</th><th>Competition</th><th>Category</th><th>Season</th><th>Score</th><th>Status</th><th>Actions</th>
  </tr></thead>
  <tbody>${matches.map(m => {
    const win  = m.home_score != null && m.away_score != null && m.home_score > m.away_score;
    const loss = m.home_score != null && m.away_score != null && m.home_score < m.away_score;
    return `<tr>
      <td style="white-space:nowrap">${m.date ? m.date.split('T')[0] : '—'}</td>
      <td style="font-weight:600">${m.opponent || '—'}</td>
      <td class="td-muted">${m.competition || '—'}</td>
      <td><span class="badge ${catBadge[m.category]||'badge-gray'}" style="font-size:10px">${m.category||'—'}</span></td>
      <td class="td-muted">${seasonMap[m.season_id] || '—'}</td>
      <td>
        <span style="font-weight:700;font-variant-numeric:tabular-nums">${m.home_score ?? '—'}–${m.away_score ?? '—'}</span>
        ${m.status === 'completed' ? `<span class="badge ${win?'badge-green':loss?'badge-red':'badge-gray'}" style="margin-left:4px">${win?'W':loss?'L':'D'}</span>` : ''}
      </td>
      <td><span class="badge ${m.status==='live'?'badge-red':m.status==='completed'?'badge-green':m.status==='scheduled'?'badge-blue':'badge-gray'}">${m.status}</span></td>
      <td>
        <div style="display:flex;gap:3px;flex-wrap:wrap">
          ${m.status === 'scheduled' ? `<button class="btn btn-sm" style="background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)" onclick="startLiveMatch('${m.id}')">▶</button>` : ''}
          <button class="btn btn-sm" style="background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3)" onclick="showManualStatsModal('${m.id}')" title="Input Stats">📝</button>
          ${m.status === 'completed' || m.status === 'live' ? `<button class="btn btn-secondary btn-sm" onclick="viewBoxScore('${m.id}')">Box</button>` : ''}
          <button class="btn btn-secondary btn-sm" onclick="showNewMatchModal('${m.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteMatch('${m.id}','${(m.opponent||'').replace(/'/g,"\\'")}','${m.date?.split('T')[0]||''}')" title="Hapus pertandingan">🗑</button>
        </div>
      </td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

async function filterMatches() {
  const search  = (document.getElementById('match-search')?.value || '').toLowerCase();
  const status  = document.getElementById('match-status-filter')?.value  || 'all';
  const seasonId= document.getElementById('match-season-filter')?.value  || '';
  const comp    = document.getElementById('match-comp-filter')?.value    || '';
  const result  = document.getElementById('match-result-filter')?.value  || '';

  let matches = window._allMatches || [];

  if (search)   matches = matches.filter(m =>
    (m.opponent || '').toLowerCase().includes(search) ||
    (m.competition || '').toLowerCase().includes(search));
  if (status !== 'all') matches = matches.filter(m => m.status === status);
  if (seasonId) matches = matches.filter(m => m.season_id === seasonId);
  if (comp) {
    if (comp.startsWith('__comp__')) {
      const compName = comp.slice(8);
      matches = matches.filter(m => m.competition === compName);
    } else {
      matches = matches.filter(m => m.category === comp);
    }
  }
  if (result === 'W') matches = matches.filter(m => m.home_score != null && m.home_score > m.away_score);
  if (result === 'L') matches = matches.filter(m => m.home_score != null && m.home_score < m.away_score);

  document.getElementById('matches-table-wrap').innerHTML = renderMatchesTable(matches, window._seasonMap || {});
  updateMatchCountLabel(matches.length);
}

async function deleteMatch(matchId, opponent, date) {
  if (!confirm(`Hapus pertandingan vs ${opponent} (${date||'?'})?\n\nSemua event, roster, dan statistik pertandingan ini akan ikut terhapus permanen.\n\nLanjut?`)) return;

  // Delete related records
  const [events, rosters] = await Promise.all([
    txGetAll('game_events', 'match_id', matchId),
    txGetAll('match_rosters', 'match_id', matchId),
  ]);
  for (const e of events)  await txDelete('game_events',    e.id);
  for (const r of rosters) await txDelete('match_rosters',  r.id);
  await txDelete('matches', matchId);
  await audit('match', matchId, 'delete', { opponent, date });

  toast(`Match vs ${opponent} dihapus`, 'success');

  // Remove from in-memory list and re-render
  window._allMatches = (window._allMatches || []).filter(m => m.id !== matchId);
  await filterMatches();
}

async function renderLive() {

  if (!state.liveMatch) {
    const matches = await txGetAll('matches');

    const scheduled = (await txGetAll('matches','status','scheduled')).sort((a,b)=>new Date(a.date||0)-new Date(b.date||0));

function renderEventRow(e, players) {
  const player = players.find(p=>p.id===e.player_id);
  const colors = {
    '2PM':'#34d399','3PM':'#34d399','FTM':'#34d399',
    '2PA':'#f87171','3PA':'#f87171','FTA':'#f87171',
    'TOV':'#f87171','PF':'#fbbf24','ORB':'#60a5fa','DRB':'#60a5fa',
    'AST':'#a78bfa','STL':'#a78bfa','BLK':'#a78bfa',
  };
  const color = colors[e.type]||'var(--text-muted)';
  return `<div class="event-row">
    <div class="event-time">Q${e.period}</div>
    <div style="color:${color};font-weight:600;font-size:12px;width:36px;flex-shrink:0">${e.type}</div>
    <div class="event-type">${player?player.name:'—'} <span style="font-size:10px;color:var(--text-muted)">[${e.team}]</span></div>
    ${e.voided?'<span class="badge badge-red" style="font-size:9px">void</span>':''}
    <button onclick="voidEvent('${e.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:11px;padding:2px 4px" title="Void this event">✕</button>
  </div>`;

function selectPlayer(id) {

  document.querySelectorAll('.player-btn').forEach(b=>b.classList.remove('selected'));
  const btn = document.getElementById(`pbtn-${id}`);
  if (btn) btn.classList.add('selected');

function updateEventTeam() {}

async function recordEvent(type) {
  const ls = window._liveState;
  if (!ls?.match) return;
  const playerId = ls.selectedPlayer;
  const needsPlayer = !['timeout_home','timeout_away','period_start','period_end'].includes(type);
  if (needsPlayer && !playerId) { toast('Select a player first', 'warning'); return; }
  const teamSel = document.getElementById('event-team-select');
  const team = teamSel?.value||'home';
  
  const ev = {
    id: uuid(),
    match_id: ls.match.id,
    period: ls.period,
    player_id: playerId||null,
    team,
    type,
    voided: false,
    created_at: now(),
  };
  await txPut('game_events', ev);
  window._lastEventId = ev.id;
  
  // Update live score display
  if (team==='home') {
    if (type==='2PM') ls.homeScore+=2;
    else if (type==='3PM') ls.homeScore+=3;
    else if (type==='FTM') ls.homeScore+=1;
  } else {
    if (type==='2PM') ls.awayScore+=2;
    else if (type==='3PM') ls.awayScore+=3;
    else if (type==='FTM') ls.awayScore+=1;
  }
  document.getElementById('live-home-score').textContent = ls.homeScore;
  document.getElementById('live-away-score').textContent = ls.awayScore;
  
  // Add to log
  const logEl = document.getElementById('event-log');
  if (logEl) {
    const player = ls.players.find(p=>p.id===playerId);
    logEl.insertAdjacentHTML('afterbegin', renderEventRow(ev, ls.players));
    if (logEl.children.length > 15) logEl.lastChild?.remove();
  }
  
  toast(`${type} recorded`, 'success');
  await audit('game_event', ev.id, 'create', { type, team, player_id: playerId });
}

async function voidEvent(eventId) {
  if (!confirm('Void this event? This will remove it from statistics.')) return;
  const ev = await txGet('game_events', eventId);
  if (!ev) return;
  ev.voided = true;
  ev.voided_at = now();
  await txPut('game_events', ev);
  await audit('game_event', eventId, 'void', {});
  toast('Event voided', 'success');
  await renderLive();
}

async function undoLastEvent() {
  if (!window._lastEventId) { toast('No recent event to undo', 'warning'); return; }
  const ev = await txGet('game_events', window._lastEventId);
  if (!ev || ev.voided) { toast('Event already voided or not found', 'warning'); return; }
  ev.voided = true; ev.voided_at = now();
  await txPut('game_events', ev);
  window._lastEventId = null;
  toast('Last event undone', 'success');
  await renderLive();
}

async function advancePeriod() {
  if (!state.liveMatch) return;
  const maxQ = 4;
  if (state.liveMatch.current_period >= maxQ) { toast('Final quarter — use End Game to finish', 'warning'); return; }
  state.liveMatch.current_period = (state.liveMatch.current_period||1)+1;
  await txPut('matches', state.liveMatch);
  window._liveState.period = state.liveMatch.current_period;
  document.getElementById('live-period').textContent = `Q${state.liveMatch.current_period}`;
  toast(`Quarter ${state.liveMatch.current_period} started`, 'success');
}

async function endGame() {
  if (!confirm('End the game? This will mark it as completed and calculate final scores.')) return;
  const match = state.liveMatch;
  const events = (await txGetAll('game_events','match_id',match.id)).filter(e=>!e.voided);
  let homeScore=0, awayScore=0;
  for (const e of events) {
    if (e.team==='home') { if(e.type==='2PM')homeScore+=2; else if(e.type==='3PM')homeScore+=3; else if(e.type==='FTM')homeScore+=1; }
    else { if(e.type==='2PM')awayScore+=2; else if(e.type==='3PM')awayScore+=3; else if(e.type==='FTM')awayScore+=1; }
  }
  match.status = 'completed';
  match.home_score = homeScore;
  match.away_score = awayScore;
  match.updated_at = now();
  await txPut('matches', match);
  await audit('match', match.id, 'complete', { home_score: homeScore, away_score: awayScore });
  await createAutoBackup('post_game');
  state.liveMatch = null;
  toast(`Game ended: ${homeScore}–${awayScore}`, 'success');
  await openBoxScore(match.id);
}

async function showRosterModal() {
  if (!state.liveMatch) return;
  const [players, roster] = await Promise.all([txGetAll('players','status','active'), txGetAll('match_rosters','match_id',state.liveMatch.id)]);
  const rosterIds = roster.map(r=>r.player_id);
  showModal('Edit Roster', `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Select players for this match:</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
      ${players.map(p=>`
        <label style="display:flex;align-items:center;gap:8px;padding:8px;background:var(--bg-elevated);border-radius:6px;cursor:pointer">
          <input type="checkbox" value="${p.id}" ${rosterIds.includes(p.id)?'checked':''}>
          <span>#${p.number??'?'} ${p.name}</span>
        </label>
      `).join('')}
    </div>
  `, async () => {
    const checked = [...document.querySelectorAll('#modal-body input[type=checkbox]:checked')].map(c=>c.value);
    // Remove old roster entries
    for (const r of roster) await txDelete('match_rosters', r.id);
    // Add new
    for (const pid of checked) {
      await txPut('match_rosters', { id: uuid(), match_id: state.liveMatch.id, player_id: pid, created_at: now() });
    }
    toast('Roster updated', 'success');
    closeModal();
    await renderLive();
  });
}
